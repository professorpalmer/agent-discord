[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-discord"
version = "0.1.0"
description = "Local Discord-native agent bridge: natural-language tasks via MCP Discord adapters and a pinned Puppetmaster backend."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "agent-discord contributors" }]
keywords = ["discord", "mcp", "puppetmaster", "agent", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-discord = "agent_discord.cli:main"

[project.urls]
Homepage = "https://github.com/professorpalmer/agent-discord"
Attribution-SaseQ = "https://github.com/SaseQ/discord-mcp"
Attribution-BrainDAO = "https://github.com/BrainDAO/mcp-discord"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
